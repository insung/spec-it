<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spec-it 능동형 정책 루프</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45, 49, 66, 0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235, 108, 54, 0.08);
      --font-sans: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono: 'Geist Mono', 'Noto Sans Mono CJK KR', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }
    .frame { width: min(100%, 1280px); }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .subtitle {
      max-width: 920px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }
    .diagram { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 960px; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Process · Active Policy Loop</p>
    <h1>spec-it이 작업 전·중·후에 방향을 유지하는 방식</h1>
    <p class="subtitle">모든 이벤트는 비용이 낮은 Light 판정을 거치고, 중요한 변경 신호가 있을 때만 관련 규칙을 읽는 Hard 평가로 깊어진다. AI는 그 결과를 작업 맥락으로 사용하며, 최종 판단은 사람에게 남는다.</p>

    <div class="diagram">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="active-policy-loop-title active-policy-loop-desc" data-diagram-type="process" data-detail="balanced" data-audience="mixed">
        <title id="active-policy-loop-title">spec-it 능동형 정책 루프</title>
        <desc id="active-policy-loop-desc">Claude 훅이 세션과 도구 이벤트를 받아 Light 판정, 선택적 Hard 평가, AI 작업, 실제 변경 점검, 사람의 최종 승인으로 연결하는 다섯 단계 정책 루프를 보여준다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- Handoffs are drawn before stage cards. -->
        <line x1="248" y1="342" x2="288" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="496" y1="342" x2="536" y2="342" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="744" y1="342" x2="784" y2="342" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="992" y1="342" x2="1032" y2="342" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Stage 1 -->
        <g>
          <rect x="136" y="72" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
          <text x="144" y="84" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">1</text>
          <text x="144" y="112" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing="0.12em">CONTEXT</text>
          <rect x="40" y="132" width="208" height="420" rx="8" fill="#f5f5f5"/>
          <rect x="40" y="132" width="208" height="420" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
          <rect x="52" y="144" width="36" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)"/>
          <text x="70" y="156" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">HOOK</text>
          <text x="144" y="180" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="14" font-weight="600" text-anchor="middle">정책 맥락 준비</text>
          <line x1="52" y1="196" x2="236" y2="196" stroke="rgba(45,49,66,0.12)"/>
          <text x="56" y="216" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">QUESTION</text>
          <text x="56" y="246" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">정책 적용 프로젝트인가?</text>
          <line x1="52" y1="284" x2="236" y2="284" stroke="rgba(45,49,66,0.12)"/>
          <text x="56" y="304" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">INPUT</text>
          <text x="56" y="334" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">manifest · lock · pinned tag</text>
          <line x1="52" y1="372" x2="236" y2="372" stroke="rgba(45,49,66,0.12)"/>
          <text x="56" y="392" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">CONTROL</text>
          <text x="56" y="422" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">프로젝트별 명시적 opt-in</text>
          <line x1="52" y1="460" x2="236" y2="460" stroke="rgba(45,49,66,0.12)"/>
          <text x="56" y="480" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">OUTPUT</text>
          <text x="56" y="510" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">고정된 정책 기준선</text>
        </g>

        <!-- Stage 2 -->
        <g>
          <rect x="384" y="72" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
          <text x="392" y="84" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">2</text>
          <text x="392" y="112" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing="0.12em">SIGNAL</text>
          <rect x="288" y="132" width="208" height="420" rx="8" fill="#f5f5f5"/>
          <rect x="288" y="132" width="208" height="420" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
          <rect x="300" y="144" width="40" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)"/>
          <text x="320" y="156" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">CORE</text>
          <text x="392" y="180" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="14" font-weight="600" text-anchor="middle">변경 신호 판정</text>
          <line x1="300" y1="196" x2="484" y2="196" stroke="rgba(45,49,66,0.12)"/>
          <text x="304" y="216" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">QUESTION</text>
          <text x="304" y="240" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">중요한 변경 의도가</text>
          <text x="304" y="260" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">있는가?</text>
          <line x1="300" y1="284" x2="484" y2="284" stroke="rgba(45,49,66,0.12)"/>
          <text x="304" y="304" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">INPUT</text>
          <text x="304" y="334" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">prompt · tool · diff signal</text>
          <line x1="300" y1="372" x2="484" y2="372" stroke="rgba(45,49,66,0.12)"/>
          <text x="304" y="392" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">CONTROL</text>
          <text x="304" y="416" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">결정적 · 읽기 전용</text>
          <text x="304" y="436" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">반복 신호 중복 제거</text>
          <line x1="300" y1="460" x2="484" y2="460" stroke="rgba(45,49,66,0.12)"/>
          <text x="304" y="480" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">OUTPUT</text>
          <text x="304" y="510" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">무출력 또는 Hard 신호</text>
        </g>

        <!-- Stage 3: focal -->
        <g>
          <rect x="632" y="72" width="16" height="16" rx="8" fill="rgba(235,108,54,0.20)"/>
          <text x="640" y="84" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">3</text>
          <text x="640" y="112" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing="0.12em">EVALUATE</text>
          <rect x="536" y="132" width="208" height="420" rx="8" fill="#f5f5f5"/>
          <rect x="536" y="132" width="208" height="420" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
          <rect x="548" y="144" width="48" height="16" rx="2" fill="rgba(235,108,54,0.18)"/>
          <text x="572" y="156" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">POLICY</text>
          <text x="640" y="180" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="14" font-weight="600" text-anchor="middle">Light / Hard 평가</text>
          <line x1="548" y1="196" x2="732" y2="196" stroke="rgba(235,108,54,0.25)"/>
          <text x="552" y="216" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">QUESTION</text>
          <text x="552" y="240" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">얼마나 깊게</text>
          <text x="552" y="260" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">확인할 것인가?</text>
          <line x1="548" y1="284" x2="732" y2="284" stroke="rgba(235,108,54,0.25)"/>
          <text x="552" y="304" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">INPUT</text>
          <text x="552" y="334" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">signal + 관련 규칙만</text>
          <line x1="548" y1="372" x2="732" y2="372" stroke="rgba(235,108,54,0.25)"/>
          <text x="552" y="392" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">CONTROL</text>
          <rect x="552" y="406" width="52" height="20" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
          <text x="578" y="420" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="8" font-weight="600" text-anchor="middle">LIGHT</text>
          <text x="612" y="420" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">항상 · 추가 호출 0</text>
          <rect x="552" y="434" width="52" height="20" rx="4" fill="rgba(235,108,54,0.12)" stroke="rgba(235,108,54,0.50)"/>
          <text x="578" y="448" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="8" font-weight="600" text-anchor="middle">HARD</text>
          <text x="612" y="448" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">필요할 때 · 규칙 ≤ 8</text>
          <line x1="548" y1="460" x2="732" y2="460" stroke="rgba(235,108,54,0.25)"/>
          <text x="552" y="480" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">OUTPUT</text>
          <text x="552" y="510" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">근거가 붙은 정책 context</text>
        </g>

        <!-- Stage 4 -->
        <g>
          <rect x="880" y="72" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
          <text x="888" y="84" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">4</text>
          <text x="888" y="112" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing="0.12em">WORK</text>
          <rect x="784" y="132" width="208" height="420" rx="8" fill="#f5f5f5"/>
          <rect x="784" y="132" width="208" height="420" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
          <rect x="796" y="144" width="28" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)"/>
          <text x="810" y="156" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">AI</text>
          <text x="888" y="180" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="14" font-weight="600" text-anchor="middle">정책 안에서 작업</text>
          <line x1="796" y1="196" x2="980" y2="196" stroke="rgba(45,49,66,0.12)"/>
          <text x="800" y="216" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">QUESTION</text>
          <text x="800" y="240" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">정책 범위 안에서</text>
          <text x="800" y="260" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">진행 가능한가?</text>
          <line x1="796" y1="284" x2="980" y2="284" stroke="rgba(45,49,66,0.12)"/>
          <text x="800" y="304" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">INPUT</text>
          <text x="800" y="334" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">사용자 요청 + 정책 context</text>
          <line x1="796" y1="372" x2="980" y2="372" stroke="rgba(45,49,66,0.12)"/>
          <text x="800" y="392" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">CONTROL</text>

          <text x="800" y="438" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">추측하지 않고 human-review</text>
          <line x1="796" y1="460" x2="980" y2="460" stroke="rgba(45,49,66,0.12)"/>
          <text x="800" y="480" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="0.1em">OUTPUT</text>
          <text x="800" y="510" fill="#2d3142" font-family="'Geist','Noto Sans KR',sans-serif" font-size="12">코드 · 문서 · 검증 증거</text>
        </g>

        <!-- Stage 5 -->
        <g>
          <rect x="1128" y="72" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
          <text x="1136" y="84" fill="#2d3142" font-family="'Geist Mono', monospace" font-size="8" font-weight="600" text-anchor="middle">5</text>
          <text x="1136" y="112" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" text-anchor="middle" letter-spacing="0.12em">CLOSE</text>
