refresh_triggers:
  - Change of baseline HEAD or working-tree file content since recorded inspection.
  - Added or discovered strategy, caller, consumer, configuration, stored field, or external contract.
  - Source revision, intent decision, design state, scenario expectation, or test fixture change.
  - New session or resumed work with an old discovery record.
  - Changed permissions or availability of an external source.
refresh_protocol:
  - Read the active spec, baseline, changed files, declared relations, and prior unknowns.
  - Compare available revisions and dirty-state evidence; record inaccessible comparisons.
  - Reassess linked unchanged consumers as well as touched paths.
  - Mark affected decisions and runs for review; preserve historical evidence.
  - Ask only new material decisions; continue work covered by existing approval.
