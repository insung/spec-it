# 0.2.0 정책용 시작 템플릿. 실제 사용자 승인이 아니므로 contract status는 draft를 유지한다.
# MSG-001/MSG-002: ../../rules/messages/ 와 ../../schemas/user-message-contract.schema.json 참조.
# 아래 값은 예시이며 복사 후 프로젝트가 조건·문구·권한·검증 사례를 승인한다.
# 기존 OpenAPI 등에 같은 정의가 있으면 이 파일에 중복하지 않고 그 정본에 연결한다.
# 이 최소 형식은 필수 primitive parameter만 다룬다. 복합/선택 parameter는 프로젝트 계약을 사용한다.
schema_version: 0.1.0
contract_id: example-operation
contract_version: 0.1.0
status: draft
source:
  mode: contract-first
  canonical_path: contracts/user-message-contract.yaml
owners:
  intent: "<intent-owner>"
  contract: "<contract-owner>"
  content: "<content-owner>"
transport: http
default_locale: ko
supported_locales: [ko]
catalogs:
  ko:
    operation.unavailable: "현재 요청을 처리할 수 없습니다."
    common.unknown: "처리 결과를 확인하지 못했습니다. 다시 실행하기 전에 상태를 확인해 주세요."
unknown_outcome:
  message_key: common.unknown
  retry: never
  user_action: "<안전한 확인 방법; 무조건 다시 실행을 안내하지 않음>"
outcomes:
  - code: OPERATION_UNAVAILABLE
    kind: rejection
    http_status: 409
    audience: "<사용자와 권한 범위>"
    public_params: {}
    message:
      key: operation.unavailable
      show_when: "<서버가 이 code를 반환하고 해당 작업 화면이 활성인 경우>"
      hide_when: "<성공·진행·다른 오류이거나 이미 종료된 작업인 경우>"
      priority: 10
      clear_when: "<상태 갱신 또는 사용자가 안내를 닫는 경우>"
      user_action: "<허용된 수정 또는 확인 방법>"
    telemetry:
      event: operation.rejected
      level: info
      fields: [code, request_id]
    follow_up:
      action: none
      delivery: none
      retry: never
      retry_safety: "<같은 요청의 재실행 안전성이 승인되지 않음>"
acceptance_cases:
  - id: visible-rejection
    outcome_code: OPERATION_UNAVAILABLE
    locale: ko
    given: "<사람이 확인할 선행 상태>"
    when: "<실행할 작업>"
    expected: {visible: true, message_key: operation.unavailable, retry: never}
    test_ref: "not-implemented:visible-rejection"
  - id: suppressed-rejection
    outcome_code: OPERATION_UNAVAILABLE
    locale: ko
    given: "<이미 종료되어 안내를 표시하면 안 되는 상태>"
    when: "<이전 요청의 늦은 응답>"
    expected: {visible: false, message_key: null, retry: never}
    test_ref: "not-implemented:suppressed-rejection"
