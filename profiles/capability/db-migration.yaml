schema_version: 0.1.0
profile_id: capability/db-migration
axis: capability
version: 0.4.0
status: active
description: Versioned and auditable database change delivery capability.
applies_when:
  - The project authors, requests, or applies database schema, routine, reference-data, or backfill changes.
rules:
  - DATA-009
  - DATA-007
  - COMP-001
  - ARCH-005
  - REL-001
  - CICD-001
  - TST-003
  - TST-006
parameters:
  responsibility_roles:
    - object-decision-owner
    - definition-authority
    - executor
  execution_default: deployment-pipeline-single-activity
  application_startup: compatibility-check-only
  release_definition: immutable-version-and-checksum
  environment_history: references-release-digest
  current_state_projection: optional-declared-and-reconciled
  historical_change: explicitly-reconciled
  recovery_classes:
    - reversible
    - expand-contract-or-forward-fix
    - replayable-data-change
    - restore-dependent
evidence:
  release: immutable-definition
  environment: per-release-digest-and-environment
  reconciliation: after-emergency-or-delegated-execution
conflicts: []
